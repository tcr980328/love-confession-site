<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#fbdde5" />
  <title>給我最喜歡的你</title>
  <style>
:root {
  --rose: #ef5e82;
  --rose-dark: #be365b;
  --ink: #542737;
  --cream: #fffaf8;
}

* {
  box-sizing: border-box;
}

html,
body {
  min-height: 100%;
}

body {
  margin: 0;
  background: #fbdde5;
  color: var(--ink);
  font-family: "Noto Serif TC", "Microsoft JhengHei", "PingFang TC", serif;
}

button {
  font: inherit;
}

.love-page {
  position: relative;
  isolation: isolate;
  min-height: 100svh;
  overflow: hidden;
  display: grid;
  place-items: center;
  padding: 46px 20px 72px;
  background:
    radial-gradient(circle at 15% 15%, rgba(255,255,255,.92) 0 2px, transparent 3px),
    radial-gradient(circle at 82% 24%, rgba(255,255,255,.75) 0 1.5px, transparent 2.5px),
    linear-gradient(145deg, #fff1f4 0%, #fbd5df 48%, #f8c5d3 100%);
  background-size: 52px 52px, 68px 68px, auto;
}

.love-page::before,
.love-page::after {
  content: "";
  position: fixed;
  z-index: -2;
  width: 260px;
  height: 260px;
  border: 1px solid rgba(210, 70, 105, .18);
  border-radius: 48% 52% 44% 56%;
  animation: slow-spin 24s linear infinite;
}

.love-page::before {
  left: -120px;
  top: -100px;
}

.love-page::after {
  right: -130px;
  bottom: -120px;
  width: 340px;
  height: 340px;
  animation-direction: reverse;
}

.ambient-glow {
  position: fixed;
  z-index: -3;
  border-radius: 999px;
  filter: blur(12px);
  opacity: .45;
}

.glow-one {
  width: 330px;
  height: 330px;
  top: -110px;
  right: 4%;
  background: #fff7b9;
}

.glow-two {
  width: 420px;
  height: 420px;
  bottom: -220px;
  left: 3%;
  background: #ef86a7;
}

.heart-field {
  position: fixed;
  inset: 0;
  z-index: -1;
  overflow: hidden;
  pointer-events: none;
}

.floating-heart {
  position: absolute;
  bottom: -70px;
  color: rgba(221, 67, 105, .28);
  text-shadow: 0 5px 14px rgba(179, 48, 84, .12);
  animation: float-up linear infinite;
}

.proposal-card {
  position: relative;
  width: min(100%, 680px);
  min-height: 570px;
  padding: 34px 54px 38px;
  text-align: center;
  border: 1px solid rgba(255,255,255,.88);
  border-radius: 34px;
  background: rgba(255, 250, 248, .8);
  box-shadow:
    0 32px 80px rgba(147, 45, 75, .19),
    inset 0 1px 0 rgba(255,255,255,.9);
  backdrop-filter: blur(18px);
  animation: card-in .8s cubic-bezier(.2,.8,.2,1) both;
}

.proposal-card::before {
  content: "";
  position: absolute;
  inset: 13px;
  border: 1px solid rgba(217, 104, 133, .18);
  border-radius: 25px;
  pointer-events: none;
}

.tiny-label {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 8px 14px;
  border-radius: 999px;
  background: #fff;
  color: #a64b67;
  font-size: 12px;
  letter-spacing: .18em;
  box-shadow: 0 8px 24px rgba(157, 54, 83, .08);
}

.tiny-label span {
  color: var(--rose);
  font-size: 17px;
}

.hero-heart {
  display: grid;
  place-items: center;
  width: 76px;
  height: 76px;
  margin: 25px auto 13px;
  border-radius: 50%;
  background: linear-gradient(145deg, #fff 0%, #ffe3e9 100%);
  box-shadow: 0 14px 35px rgba(202, 61, 101, .17);
}

.hero-heart span {
  color: var(--rose);
  font-size: 42px;
  line-height: 1;
  animation: heartbeat 1.6s ease-in-out infinite;
}

.eyebrow {
  margin: 0 0 10px;
  color: #b97688;
  font-family: Arial, sans-serif;
  font-size: 10px;
  font-weight: 700;
  letter-spacing: .34em;
}

h1 {
  margin: 0;
  color: #572638;
  font-size: clamp(30px, 5.3vw, 48px);
  font-weight: 700;
  line-height: 1.28;
  letter-spacing: .035em;
}

.intro {
  margin: 18px auto 12px;
  color: #875668;
  font-size: 15px;
  line-height: 1.9;
}

.choice-zone {
  position: relative;
  height: 126px;
  margin: 13px auto 0;
}

.yes-button,
.no-button {
  position: absolute;
  border: 0;
  border-radius: 999px;
  cursor: pointer;
  transition: transform .2s ease, box-shadow .2s ease, opacity .2s ease;
}

.yes-button {
  left: 14%;
  top: 20px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  width: 170px;
  height: 58px;
  background: linear-gradient(135deg, #f67492, #d94069);
  color: white;
  font-weight: 700;
  letter-spacing: .12em;
  box-shadow: 0 14px 30px rgba(204, 53, 94, .3);
}

.yes-button:hover {
  transform: translateY(-3px) scale(1.03);
  box-shadow: 0 18px 36px rgba(204, 53, 94, .38);
}

.yes-button:active {
  transform: translateY(0) scale(.98);
}

.button-heart {
  font-size: 15px;
}

.no-button {
  left: 56%;
  top: 20px;
  width: 170px;
  height: 58px;
  background: rgba(255,255,255,.76);
  color: #a0707e;
  border: 1px solid rgba(176, 99, 120, .2);
  box-shadow: 0 8px 20px rgba(136, 59, 81, .08);
}

.yes-button:focus-visible,
.no-button:focus-visible {
  outline: 3px solid rgba(170, 35, 75, .4);
  outline-offset: 4px;
}

.hint {
  min-height: 24px;
  margin: -7px 0 0;
  color: #b27586;
  font-size: 13px;
  letter-spacing: .06em;
}

.success-card {
  min-height: 580px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  overflow: hidden;
}

.accepted-heart {
  display: grid;
  place-items: center;
  width: 108px;
  height: 108px;
  margin: 8px 0 22px;
  color: white;
  font-size: 54px;
  border-radius: 50%;
  background: linear-gradient(145deg, #ff8ba6, #d83f68);
  box-shadow: 0 18px 44px rgba(201, 52, 92, .3);
  animation: success-pop .65s cubic-bezier(.2,1.4,.4,1) both, heartbeat 1.7s 1s ease-in-out infinite;
}

.success-card h1 {
  font-size: clamp(29px, 5vw, 43px);
}

.love-note {
  max-width: 510px;
  margin-top: 24px;
  color: #774c5c;
  font-size: 15px;
  line-height: 1.9;
}

.love-note p {
  margin: 0 0 10px;
}

.love-note span {
  color: var(--rose);
  font-size: 20px;
}

.signature {
  margin: 10px 0 0;
  color: #b15d76;
  font-size: 13px;
  letter-spacing: .12em;
}

.celebration span {
  position: absolute;
  left: calc(7% + (var(--i) * 6.7%));
  top: -24px;
  color: #ee6c8c;
  font-size: calc(12px + (var(--i) % 3) * 6px);
  opacity: .65;
  animation: confetti-fall 4s calc((var(--i) % 5) * -.65s) linear infinite;
}

.footer-note {
  position: absolute;
  bottom: 23px;
  margin: 0;
  color: rgba(116, 50, 70, .52);
  font: 10px/1 Arial, sans-serif;
  letter-spacing: .2em;
  text-transform: uppercase;
}

.footer-note span {
  color: #d94770;
}

@keyframes float-up {
  0% { transform: translateY(0) rotate(-8deg); opacity: 0; }
  10% { opacity: .8; }
  55% { transform: translateY(-55vh) translateX(24px) rotate(8deg); }
  100% { transform: translateY(-115vh) translateX(-16px) rotate(-5deg); opacity: 0; }
}

@keyframes heartbeat {
  0%, 100% { transform: scale(1); }
  15% { transform: scale(1.14); }
  30% { transform: scale(1); }
  44% { transform: scale(1.09); }
}

@keyframes card-in {
  from { opacity: 0; transform: translateY(18px) scale(.98); }
  to { opacity: 1; transform: translateY(0) scale(1); }
}

@keyframes success-pop {
  from { opacity: 0; transform: scale(.4) rotate(-14deg); }
  to { opacity: 1; transform: scale(1) rotate(0); }
}

@keyframes confetti-fall {
  from { transform: translateY(-20px) rotate(0); }
  to { transform: translateY(650px) rotate(360deg); }
}

@keyframes slow-spin {
  to { transform: rotate(360deg); }
}

@media (max-width: 620px) {
  .love-page {
    padding: 24px 14px 58px;
  }

  .proposal-card {
    min-height: 570px;
    padding: 28px 22px 30px;
    border-radius: 27px;
  }

  .proposal-card::before {
    inset: 9px;
    border-radius: 20px;
  }

  .hero-heart {
    width: 68px;
    height: 68px;
    margin-top: 22px;
  }

  .hero-heart span {
    font-size: 36px;
  }

  h1 {
    font-size: clamp(28px, 9vw, 38px);
  }

  .intro {
    font-size: 14px;
  }

  .desktop-break {
    display: none;
  }

  .choice-zone {
    height: 138px;
  }

  .yes-button {
    left: 3%;
    width: 124px;
    height: 54px;
  }

  .no-button {
    left: 53%;
    width: 124px;
    height: 54px;
  }

  .success-card {
    min-height: 620px;
  }

  .love-note {
    font-size: 14px;
    line-height: 1.85;
  }
}

@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    scroll-behavior: auto !important;
    animation-duration: .01ms !important;
    animation-iteration-count: 1 !important;
  }
}

  </style>
</head>
<body>
  <main class="love-page">
    <div class="ambient-glow glow-one"></div>
    <div class="ambient-glow glow-two"></div>
    <div class="heart-field" aria-hidden="true" id="heartField"></div>

    <section class="proposal-card" aria-labelledby="proposal-title" id="proposalCard">
      <div class="tiny-label"><span>♡</span> 給我最喜歡的你</div>
      <div class="hero-heart" aria-hidden="true"><span>♥</span></div>
      <p class="eyebrow">I HAVE A QUESTION</p>
      <h1 id="proposal-title">請問你願意跟我交往嗎？</h1>
      <p class="intro">
        喜歡你不是一時興起，是每一次見到你之後，<br class="desktop-break" />
        都更確定想把往後的日子也分給你。
      </p>
      <div class="choice-zone">
        <button class="yes-button" id="yesButton" type="button">
          <span>我願意</span><span class="button-heart" aria-hidden="true">♥</span>
        </button>
        <button class="no-button" id="noButton" type="button" aria-label="不願意（這個按鈕會躲開）">不願意</button>
      </div>
      <p class="hint" id="hint" aria-live="polite">給我一個機會，好嗎？</p>
    </section>

    <p class="footer-note">made with <span aria-hidden="true">♥</span> for you</p>
  </main>

<script>
const floatingHearts = [
  { left: "5%", size: 22, delay: "-2s", duration: "12s" },
  { left: "14%", size: 34, delay: "-8s", duration: "15s" },
  { left: "24%", size: 18, delay: "-5s", duration: "11s" },
  { left: "36%", size: 27, delay: "-11s", duration: "16s" },
  { left: "48%", size: 16, delay: "-4s", duration: "10s" },
  { left: "59%", size: 38, delay: "-13s", duration: "18s" },
  { left: "69%", size: 21, delay: "-7s", duration: "13s" },
  { left: "79%", size: 30, delay: "-1s", duration: "14s" },
  { left: "89%", size: 18, delay: "-9s", duration: "12s" },
  { left: "96%", size: 25, delay: "-6s", duration: "17s" },
  { left: "31%", size: 14, delay: "-3s", duration: "14s" },
  { left: "74%", size: 15, delay: "-12s", duration: "15s" }
];
const heartField = document.getElementById('heartField');
floatingHearts.forEach((heart) => {
  const span = document.createElement('span');
  span.className = 'floating-heart';
  span.textContent = '♥';
  span.style.left = heart.left;
  span.style.fontSize = heart.size + 'px';
  span.style.animationDelay = heart.delay;
  span.style.animationDuration = heart.duration;
  heartField.appendChild(span);
});

let attempts = 0;
const noButton = document.getElementById('noButton');
const yesButton = document.getElementById('yesButton');
const hint = document.getElementById('hint');
const proposalCard = document.getElementById('proposalCard');
const escapePositions = [
  { left: '53%', top: '76px' },
  { left: '2%', top: '76px' }
];
const hints = [
  '給我一個機會，好嗎？',
  '再想一下嘛…',
  '真的不再考慮一下嗎？',
  '看來命運也覺得你該選願意 ♡'
];

function dodge() {
  attempts = Math.min(attempts + 1, 3);
  hint.textContent = hints[attempts];
  if (attempts >= 3) {
    noButton.remove();
    return;
  }
  const pos = escapePositions[Math.min(attempts - 1, escapePositions.length - 1)];
  noButton.style.left = pos.left;
  noButton.style.top = pos.top;
}

noButton.addEventListener('pointerdown', (event) => {
  event.preventDefault();
  dodge();
});
noButton.addEventListener('click', (event) => {
  event.preventDefault();
  if (event.detail === 0) dodge();
});

yesButton.addEventListener('click', () => {
  proposalCard.className = 'proposal-card success-card';
  proposalCard.setAttribute('aria-live', 'polite');
  proposalCard.removeAttribute('aria-labelledby');
  proposalCard.innerHTML = `
    <div class="celebration" aria-hidden="true" id="celebration"></div>
    <p class="eyebrow">IT'S OFFICIAL</p>
    <div class="accepted-heart" aria-hidden="true">♥</div>
    <h1>好，那從今天起，<br />我們就是正式交往了！</h1>
    <div class="love-note">
      <p>謝謝你願意走進我的生活。也許我不太會說漂亮的情話，但我會認真記住你的喜歡、在意你的情緒，陪你分享每一個平凡的小日子。</p>
      <p>以後的路，開心一起笑，難過我陪你熬。請多多指教，我的另一半。<span aria-hidden="true">♡</span></p>
    </div>
    <p class="signature">— 你的專屬戀人</p>`;
  const celebration = document.getElementById('celebration');
  for (let i = 0; i < 14; i++) {
    const span = document.createElement('span');
    span.textContent = '♥';
    span.style.setProperty('--i', i);
    celebration.appendChild(span);
  }
});
</script>
</body>
</html>
